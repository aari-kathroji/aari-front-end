

<div class="body">
    <div class="wrapper">
        <form action="" [formGroup]="adminRegister">
            <h1>Staff Registration</h1>
            <div class="input-box">
                <div class="input-field">
                    <input type="text" placeholder="Full Name" required formControlName="name">
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-field">
                    <input type="text" placeholder="Username" required formControlName="userName">
                    <i class='bx bxs-user'></i>
                </div>
            </div>
    
            <div class="input-box">
                <div class="input-field">
                    <input type="email" placeholder="Email" required formControlName="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-field">
                    <input type="number" placeholder="Phone Number" required formControlName="contact">
                    <i class='bx bxs-phone'></i>
                </div>
            </div>
    
            <div class="input-box">
                <div class="input-field">
                    <input type="password" placeholder="Password" required formControlName="password">
                    
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <div class="input-field">
                    <input type="password" placeholder="Confirm Password" required formControlName="password" >
                    <i class='bx bxs-lock-alt' ></i>
                </div>
            </div>

            <div class="input-box">
                <div class="input-field">
                    <input type="address" placeholder="Address" required formControlName="address">
                    <i class='bx bxs-landmark'></i>
                </div>
                <div class="input-field">
                    <input type="gender" placeholder="Gender" required formControlName="gender">
                    <i class='bx bx-male-female'></i>
                </div>
            </div>   
            
            <label><input type="checkbox" (change)="onCheckboxChange($event)">I hereby declare that the above information provided is true and correct</label>

            <button type="submit" class="btn" (click)="onSubmit()">Register</button>
        </form>
    </div>
    </div>
