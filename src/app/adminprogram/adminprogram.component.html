<div class="admin-program-container">
  <div class="header-section">
    <h1 class="section-title">Program Management</h1>
    <button class="add-program-btn" routerLink="/admin-program-register">
      <i class="fas fa-plus-circle"></i> Add New Program
    </button>
  </div>

  <div class="program-grid">
    <div class="program-card" *ngFor="let program of programForm">
      <div class="card-content">
        <div class="card-header">
          <h2 class="program-name">{{ program.program_name }}</h2>
          <div class="program-meta">
            <span class="batch-tag">
              <i class="fas fa-users"></i> Batch {{program.batch}}
            </span>
          </div>
        </div>
        
        <p class="program-description">{{ program.program_description }}</p>
        
        <div class="tech-stack">
          <i class="fas fa-code"></i>
          <span class="tech-tags">{{program.techs}}</span>
        </div>
        
        <div class="staff-info">
          <i class="fas fa-chalkboard-teacher"></i>
          <span>{{program.staff}}</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="action-btn view" [routerLink]="['/admin-program-view', program.program_id]">
          <i class="fas fa-eye"></i>
        </button>
        <button class="action-btn edit" [routerLink]="['/admin-program-edit', program.program_id]">
          <i class="fas fa-pencil-alt"></i>
        </button>
        <button class="action-btn delete" (click)="deleteProgram(program.program_id)">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </div>
  </div>
</div>
